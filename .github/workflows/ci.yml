name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    # No Postgres service container: ProTrackerWebApplicationFactory replaces the
    # app's Npgsql DbContext registration with per-test-class SQLite files at the
    # DI level, so the suite never opens a Postgres connection. The committed
    # appsettings.json placeholder connection string only feeds the (replaced)
    # Npgsql options builder. Verified by running the suite in a clean tree with
    # no appsettings.Development.json and no database available.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore ProTracker.sln
      - name: Build
        run: dotnet build ProTracker.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test ProTracker.Tests/ProTracker.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (build, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protracker-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: protracker-client/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check + build
        run: npm run build
      - name: Bundle budget guard (PDF stays lazy, eager JS <= 1.2 MB)
        run: node scripts/check-bundle-budget.mjs
      - name: Lint
        run: npx oxlint src
      - name: Unit tests
        run: npx vitest run

  i18n-drift:
    name: i18n drift (must be 0/0/0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check locale key-set + interpolation drift
        run: node protracker-client/scripts/check-i18n-drift.mjs
