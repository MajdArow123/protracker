name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    # No Postgres service container: ProTrackerWebApplicationFactory replaces the
    # app's Npgsql DbContext registration with per-test-class SQLite files at the
    # DI level, so the suite never opens a Postgres connection. The committed
    # appsettings.json placeholder connection string only feeds the (replaced)
    # Npgsql options builder. Verified by running the suite in a clean tree with
    # no appsettings.Development.json and no database available.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore ProTracker.sln
      - name: Build
        run: dotnet build ProTracker.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test ProTracker.Tests/ProTracker.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (build, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protracker-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: protracker-client/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check + build
        run: npm run build
      - name: Bundle budget guard (PDF stays lazy, eager JS <= 1.2 MB)
        run: node scripts/check-bundle-budget.mjs
      - name: Lint (warnings fail the build)
        run: npx oxlint --deny-warnings src
      - name: Unit tests
        run: npx vitest run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: protracker_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: protracker-client/package-lock.json
      - name: Pre-build backend (so the Playwright webServer boot is just a run)
        run: dotnet build ProTracker.csproj
      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
        working-directory: protracker-client
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: protracker-client
      - name: Run e2e suite
        run: npx playwright test
        working-directory: protracker-client
        env:
          E2E_DB_CONN: Host=localhost;Port=5432;Database=protracker_e2e;Username=postgres;Password=postgres
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: protracker-client/playwright-report
          retention-days: 7

  i18n-drift:
    name: i18n drift (must be 0/0/0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check locale key-set + interpolation drift
        run: node protracker-client/scripts/check-i18n-drift.mjs
